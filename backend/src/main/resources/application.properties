spring.application.name=working-state
server.address=127.0.0.1
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=WORKSPACE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${WORKSPACE_SECURE_SESSION_COOKIE:true}
workspace.data-dir=${WORKSPACE_DATA_DIR:./data}
workspace.owner.username=${WORKSPACE_OWNER_USERNAME:owner}
workspace.owner.password=${WORKSPACE_OWNER_PASSWORD:}
